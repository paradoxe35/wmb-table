name: Deploy Docs to Firebase

on:
    push:
        branches:
            - main

concurrency:
    group: firebase-hosting-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 10

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts

            - name: Build docs
              env:
                  VITE_RELEASES_MANIFEST_URL: https://firebasestorage.googleapis.com/v0/b/wmb-table.appspot.com/o/releases%2Flatest.json?alt=media
              run: pnpm docs:build

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  project_id: wmb-table
                  create_credentials_file: true
                  export_environment_variables: true

            - name: Deploy to Firebase
              run: npx --yes firebase-tools deploy --only hosting,storage --project wmb-table --non-interactive
