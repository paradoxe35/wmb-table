name: Refresh Reference Database

on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: reference-db-refresh
    cancel-in-progress: true

env:
    ANDROID_APP_ID: com.vlqdo.little_storehouse
    APKEEP_VERSION: '1.0.0'
    APKEEP_ASSET: apkeep-x86_64-unknown-linux-gnu
    APKEEP_SHA256: a23579a3ba366d25a6d69848189b983d65662f4ecf4b9e11e16510811659de4e
    JADX_VERSION: 1.5.5
    ISAR_ARTIFACT_NAME: reference-db-isar

jobs:
    extract-db-isar:
        name: Extract db.isar
        runs-on: ubuntu-latest
        steps:
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: '17'

            - name: Download Android extraction tools
              run: |
                  set -euo pipefail

                  mkdir -p tmp/tools

                  curl --fail --location --show-error --silent \
                    --retry 3 --retry-delay 5 \
                    --output "tmp/tools/${APKEEP_ASSET}" \
                    "https://github.com/EFForg/apkeep/releases/download/${APKEEP_VERSION}/${APKEEP_ASSET}"
                  echo "${APKEEP_SHA256}  tmp/tools/${APKEEP_ASSET}" | sha256sum --check -
                  chmod +x "tmp/tools/${APKEEP_ASSET}"
                  ln -sf "${APKEEP_ASSET}" tmp/tools/apkeep

                  curl --fail --location --show-error --silent \
                    --retry 3 --retry-delay 5 \
                    --output tmp/tools/jadx.zip \
                    "https://github.com/skylot/jadx/releases/download/v${JADX_VERSION}/jadx-${JADX_VERSION}.zip"
                  unzip -q -o tmp/tools/jadx.zip -d tmp/tools/jadx
                  chmod +x tmp/tools/jadx/bin/jadx tmp/tools/jadx/bin/jadx-gui
                  tmp/tools/jadx/bin/jadx --version

            - name: Download Little Storehouse Android package
              run: |
                  set -euo pipefail

                  rm -rf tmp/android-source
                  mkdir -p tmp/android-source/apkeep

                  tmp/tools/apkeep --app "${ANDROID_APP_ID}" tmp/android-source/apkeep

                  xapk_file="tmp/android-source/apkeep/${ANDROID_APP_ID}.xapk"
                  if [ ! -f "${xapk_file}" ]; then
                    xapk_file="$(find tmp/android-source/apkeep -maxdepth 1 -type f -name "${ANDROID_APP_ID}*.xapk" | sort | tail -n 1)"
                  fi

                  if [ -z "${xapk_file}" ] || [ ! -f "${xapk_file}" ]; then
                    echo "apkeep completed but no ${ANDROID_APP_ID}.xapk file was produced." >&2
                    find tmp/android-source/apkeep -maxdepth 2 -type f -print >&2
                    exit 1
                  fi

                  echo "XAPK_FILE=${xapk_file}" >> "${GITHUB_ENV}"
                  ls -lh "${xapk_file}"

            - name: Extract db.isar from APK resources
              run: |
                  set -euo pipefail

                  mkdir -p tmp/android-source/xapk tmp/android-source/jadx tmp/msix-out
                  unzip -q -o "${XAPK_FILE}" -d "tmp/android-source/xapk/${ANDROID_APP_ID}"

                  base_apk="tmp/android-source/xapk/${ANDROID_APP_ID}/${ANDROID_APP_ID}.apk"
                  if [ ! -f "${base_apk}" ]; then
                    echo "The XAPK did not contain the expected base APK: ${base_apk}" >&2
                    find "tmp/android-source/xapk/${ANDROID_APP_ID}" -maxdepth 2 -type f -print >&2
                    exit 1
                  fi

                  tmp/tools/jadx/bin/jadx \
                    --no-src \
                    --output-dir tmp/android-source/jadx \
                    "${base_apk}"

                  isar_file="tmp/android-source/jadx/resources/assets/flutter_assets/assets/database/db.isar"
                  if [ ! -f "${isar_file}" ]; then
                    echo "JADX completed but db.isar was not found at ${isar_file}." >&2
                    echo "The Android package resource layout may have changed." >&2
                    find tmp/android-source/jadx \( -name "db.isar" -o -name "*.isar" \) -print >&2
                    exit 1
                  fi

                  cp "${isar_file}" tmp/msix-out/db.isar
                  ls -lh tmp/msix-out/db.isar

            - name: Upload db.isar artifact
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.ISAR_ARTIFACT_NAME }}
                  path: tmp/msix-out/db.isar
                  if-no-files-found: error
                  retention-days: 7

    refresh-reference-db:
        needs: extract-db-isar
        runs-on: ubuntu-latest
        env:
            REFRESH_BRANCH: automation/reference-db-refresh
            REPORT_DIR: reports/ci/latest
            VERIFY_REPORT_DIR: reports/ci/post-migrate
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: dart-lang/setup-dart@v1

            - name: Unpack Isar refresh tool
              run: |
                  rm -rf tmp/isar-to-sqlite tmp/msix-out
                  unzip -q -o scripts/isar-to-sqlite.zip -d tmp

            - name: Install Dart dependencies
              working-directory: tmp/isar-to-sqlite
              run: dart pub get

            - name: Generate Isar code
              working-directory: tmp/isar-to-sqlite
              run: dart run build_runner build --delete-conflicting-outputs

            - name: Download libisar runtime
              working-directory: tmp/isar-to-sqlite
              run: |
                  if [ ! -f bin/libisar.so ]; then
                    curl -sSL \
                      -o bin/libisar.so \
                      https://github.com/isar/isar/releases/download/3.1.0%2B1/libisar_linux_x64.so
                  fi

            - name: Format check tool
              working-directory: tmp/isar-to-sqlite
              run: |
                  files=$(find bin lib -type f -name '*.dart' ! -name '*.g.dart' | sort)
                  dart format --output=none --set-exit-if-changed ${files}

            - name: Analyze tool
              working-directory: tmp/isar-to-sqlite
              run: dart analyze

            - name: Download extracted Isar snapshot
              uses: actions/download-artifact@v4
              with:
                  name: ${{ env.ISAR_ARTIFACT_NAME }}
                  path: tmp/msix-out

            - name: Verify extracted Isar snapshot
              run: |
                  set -euo pipefail
                  if [ ! -f tmp/msix-out/db.isar ]; then
                    echo "Downloaded artifact did not contain tmp/msix-out/db.isar." >&2
                    exit 1
                  fi
                  ls -lh tmp/msix-out/db.isar

            - name: Compare current SQLite against latest Isar
              id: compare
              working-directory: tmp/isar-to-sqlite
              run: |
                  set +e
                  dart run bin/db_tool.dart compare \
                    --baseline-sqlite ../../resources/database/data.sqlite \
                    --candidate-isar ../msix-out/db.isar \
                    --report-dir "${REPORT_DIR}"
                  compare_exit=$?
                  set -e

                  if [ ! -f "${REPORT_DIR}/summary.json" ]; then
                    echo "Compare did not produce ${REPORT_DIR}/summary.json"
                    exit "${compare_exit}"
                  fi

                  has_changes=$(jq -r '.hasDifferences' "${REPORT_DIR}/summary.json")
                  echo "has_changes=${has_changes}" >> "${GITHUB_OUTPUT}"
                  echo "compare_exit=${compare_exit}" >> "${GITHUB_OUTPUT}"

                  if [ "${compare_exit}" -ne 0 ] && [ "${has_changes}" != "true" ]; then
                    echo "Compare failed without a valid diff report."
                    exit "${compare_exit}"
                  fi

            - name: Upload comparison reports
              uses: actions/upload-artifact@v4
              with:
                  name: reference-db-compare-report
                  path: tmp/isar-to-sqlite/${{ env.REPORT_DIR }}/
                  if-no-files-found: error

            - name: Add comparison report to workflow summary
              run: |
                  {
                    echo "## Reference database comparison"
                    echo
                    cat "tmp/isar-to-sqlite/${REPORT_DIR}/summary.md"
                  } >> "${GITHUB_STEP_SUMMARY}"

            - name: Close previous refresh pull request and delete branch
              if: steps.compare.outputs.has_changes == 'true'
              uses: actions/github-script@v8
              with:
                  github-token: ${{ github.token }}
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const branch = process.env.REFRESH_BRANCH;
                      const prs = await github.paginate(github.rest.pulls.list, {
                        owner,
                        repo,
                        state: 'open',
                        head: `${owner}:${branch}`,
                        base: 'main',
                      });

                      for (const pr of prs) {
                        core.info(`Closing PR #${pr.number}`);
                        await github.rest.pulls.update({
                          owner,
                          repo,
                          pull_number: pr.number,
                          state: 'closed',
                        });
                      }

                      try {
                        await github.rest.git.deleteRef({
                          owner,
                          repo,
                          ref: `heads/${branch}`,
                        });
                        core.info(`Deleted branch ${branch}`);
                      } catch (error) {
                        if (error.status !== 404 && error.status !== 422) {
                          throw error;
                        }
                        core.info(`Branch ${branch} did not exist or was already deleted.`);
                      }

            - name: Stop when no reference DB changes were found
              if: steps.compare.outputs.has_changes != 'true'
              run: echo "No reference database changes detected."

            - name: Regenerate data.sqlite from latest Isar
              if: steps.compare.outputs.has_changes == 'true'
              working-directory: tmp/isar-to-sqlite
              run: |
                  dart run bin/db_tool.dart migrate \
                    --isar ../msix-out/db.isar \
                    --sqlite-out ../../resources/database/data.sqlite

            - name: Verify regenerated SQLite matches latest Isar
              if: steps.compare.outputs.has_changes == 'true'
              working-directory: tmp/isar-to-sqlite
              run: |
                  dart run bin/db_tool.dart compare \
                    --baseline-sqlite ../../resources/database/data.sqlite \
                    --candidate-isar ../msix-out/db.isar \
                    --report-dir "${VERIFY_REPORT_DIR}"

            - name: Prepare PR summary files
              if: steps.compare.outputs.has_changes == 'true'
              run: |
                  mkdir -p .github/reference-db-refresh
                  refresh_date="$(date -u +%F)"
                  echo "REFRESH_DATE=${refresh_date}" >> "${GITHUB_ENV}"
                  cp tmp/isar-to-sqlite/${REPORT_DIR}/summary.md .github/reference-db-refresh/latest-summary.md
                  {
                    echo "# Automated reference database refresh"
                    echo
                    echo "@paradoxe35"
                    echo
                    echo "- Trigger: \`${{ github.event_name }}\`"
                    echo "- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    echo "- Source app: \`${ANDROID_APP_ID}\`"
                    echo "- Source Isar: \`tmp/msix-out/db.isar\`"
                    echo
                    cat .github/reference-db-refresh/latest-summary.md
                  } > .github/reference-db-refresh/pr-body.md

            - name: Create refresh pull request
              if: steps.compare.outputs.has_changes == 'true'
              id: create-pr
              uses: peter-evans/create-pull-request@v8
              with:
                  token: ${{ github.token }}
                  commit-message: 'chore: refresh reference database'
                  title: 'chore: refresh reference database (${{ env.REFRESH_DATE }})'
                  branch: ${{ env.REFRESH_BRANCH }}
                  base: main
                  delete-branch: true
                  labels: |
                      automated
                      reference-db
                  assignees: |
                      paradoxe35
                  body-path: .github/reference-db-refresh/pr-body.md
                  add-paths: |
                      resources/database/data.sqlite
                      .github/reference-db-refresh/latest-summary.md

            - name: Show pull request result
              if: steps.compare.outputs.has_changes == 'true'
              run: |
                  echo "Pull request number: ${{ steps.create-pr.outputs.pull-request-number }}"
                  echo "Pull request URL: ${{ steps.create-pr.outputs.pull-request-url }}"

    cleanup:
        needs: [extract-db-isar, refresh-reference-db]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Delete refresh artifacts
              uses: geekyeggo/delete-artifact@v5
              with:
                  name: reference-db-*
