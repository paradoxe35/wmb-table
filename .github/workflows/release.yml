name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g. v2.0.0)'
                required: true
                type: string

permissions:
    contents: write

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Determine version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                  else
                    VERSION="${GITHUB_REF#refs/tags/}"
                  fi
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
                    echo "Invalid version format: $VERSION (expected v*.*.*)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Release version: $VERSION"

            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Rebuild native modules
              run: pnpm rebuild better-sqlite3

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    build:
        needs: validate
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                      args: --linux --x64
                    - os: windows-latest
                      platform: windows
                      arch: x64
                      args: --win --x64
                    # Both arches in ONE run: the arch suffix in latest-*.yml is
                    # Linux-only, so split jobs both emit latest-mac.yml
                    - os: macos-latest
                      platform: mac
                      arch: arm64,x64
                      args: --mac --arm64 --x64
        runs-on: ${{ matrix.os }}
        env:
            MAIN_VITE_GITHUB_TOKEN: ${{ secrets.MAIN_VITE_GITHUB_TOKEN }}
            MAIN_VITE_GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Set package version from tag
              run: npm version "${{ needs.validate.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Install Linux packaging tools
              if: matrix.platform == 'linux'
              run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

            # Imported for afterPack.cjs, not for electron-builder: electron-builder wants a
            # "Developer ID Application" identity and skips signing when it finds only a
            # self-signed one. CSC_LINK stays unexported — Windows would sign with it too, and
            # electron-updater then rejects every Windows update. See .github/variables.md
            - name: Configure macOS signing
              if: matrix.platform == 'mac'
              env:
                  MAC_CSC_LINK: ${{ secrets.CSC_LINK }}
                  MAC_CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
              run: |
                  if [ -z "$MAC_CSC_LINK" ]; then
                    echo "No CSC_LINK secret: ad-hoc signing, macOS auto-update will not work"
                    exit 0
                  fi

                  KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
                  KEYCHAIN_PASSWORD="$(uuidgen)"
                  CERTIFICATE="$RUNNER_TEMP/certificate.p12"

                  echo "$MAC_CSC_LINK" | base64 --decode > "$CERTIFICATE"
                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
                  security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
                  security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
                  rm -f "$CERTIFICATE"

                  IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk -F'"' '/^[[:space:]]*[0-9]+\)/ { print $2; exit }')"
                  if [ -z "$IDENTITY" ]; then
                    echo "::error::CSC_LINK imported but it holds no code-signing identity"
                    exit 1
                  fi

                  echo "Signing as \"$IDENTITY\""
                  echo "MAC_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
                  echo "MAC_SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install platform-specific native dependencies
              run: node scripts/install-platform-deps.cjs

            - name: Rebuild native modules for Electron
              run: npx electron-rebuild -f

            - name: Build and package
              run: pnpm build && npx electron-builder ${{ matrix.args }} --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Check package contents
              run: node scripts/check-package-contents.mjs release

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.platform }}
                  path: |
                      release/*.dmg
                      release/*.exe
                      release/*.AppImage
                      release/*.deb
                      release/*.rpm
                      release/*.pacman
                      release/*.pkg.tar.zst
                      release/*.zip
                      release/*.blockmap
                      release/latest*.yml
                  if-no-files-found: ignore

    publish:
        needs: [validate, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            # Must run before every upload: latest*.yml references the safe names
            - name: Normalize artifact names
              run: node scripts/rename-release-artifacts.mjs artifacts

            - name: List artifacts
              run: find artifacts -type f | sort

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.validate.outputs.version }}
                  name: ${{ needs.validate.outputs.version }}
                  draft: true
                  generate_release_notes: true
                  files: artifacts/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate public release manifest
              env:
                  RELEASE_VERSION: ${{ needs.validate.outputs.version }}
                  RELEASE_STORAGE_PREFIX: releases
              run: node scripts/build-release-manifest.mjs artifacts artifacts/latest.json

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  project_id: wmb-table
                  create_credentials_file: true
                  export_environment_variables: true

            - name: Set up Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Upload release files to Firebase Storage
              env:
                  FIREBASE_STORAGE_BUCKET: wmb-table.appspot.com
              run: |
                  gcloud storage cp artifacts/* "gs://${FIREBASE_STORAGE_BUCKET}/releases/"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest.json" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest.yml" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest-linux.yml" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest-mac.yml" --cache-control="no-store, max-age=0"

    cleanup:
        needs: [build, publish]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Delete build artifacts
              uses: geekyeggo/delete-artifact@v5
              with:
                  name: release-*
