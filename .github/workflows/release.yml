name: Release

on:
    push:
        tags:
            - 'v*'
    workflow_dispatch:
        inputs:
            version:
                description: 'Release version (e.g. v2.0.0)'
                required: true
                type: string

permissions:
    contents: write

jobs:
    validate:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
        steps:
            - name: Determine version
              id: version
              run: |
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                    VERSION="${{ github.event.inputs.version }}"
                  else
                    VERSION="${GITHUB_REF#refs/tags/}"
                  fi
                  if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+.*$ ]]; then
                    echo "Invalid version format: $VERSION (expected v*.*.*)"
                    exit 1
                  fi
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "Release version: $VERSION"

            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Rebuild native modules
              run: pnpm rebuild better-sqlite3

            - name: Lint
              run: pnpm lint

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test

    build:
        needs: validate
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      platform: linux
                      arch: x64
                      args: --linux --x64
                    - os: windows-latest
                      platform: windows
                      arch: x64
                      args: --win --x64
                    - os: macos-latest
                      platform: mac-arm64
                      arch: arm64
                      args: --mac --arm64
                    - os: macos-latest
                      platform: mac-x64
                      arch: x64
                      args: --mac --x64
        runs-on: ${{ matrix.os }}
        env:
            MAIN_VITE_GITHUB_TOKEN: ${{ secrets.MAIN_VITE_GITHUB_TOKEN }}
            MAIN_VITE_GOOGLE_DRIVE_CREDENTIALS: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 11

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Set package version from tag
              run: npm version "${{ needs.validate.outputs.version }}" --no-git-tag-version --allow-same-version

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install platform-specific native dependencies
              run: node scripts/install-platform-deps.cjs

            - name: Rebuild native modules for Electron
              run: npx electron-rebuild -f

            - name: Build and package
              run: pnpm build && npx electron-builder ${{ matrix.args }} --publish never
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: release-${{ matrix.platform }}
                  path: |
                      release/*.dmg
                      release/*.exe
                      release/*.AppImage
                      release/*.deb
                      release/*.tar.gz
                      release/*.zip
                      release/*.blockmap
                      release/latest*.yml
                  if-no-files-found: ignore

    publish:
        needs: [validate, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Download all artifacts
              uses: actions/download-artifact@v4
              with:
                  path: artifacts
                  merge-multiple: true

            - name: List artifacts
              run: find artifacts -type f | sort

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.validate.outputs.version }}
                  name: ${{ needs.validate.outputs.version }}
                  draft: true
                  generate_release_notes: true
                  files: artifacts/*
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Generate public release manifest
              env:
                  RELEASE_VERSION: ${{ needs.validate.outputs.version }}
                  RELEASE_STORAGE_PREFIX: releases
              run: node scripts/build-release-manifest.mjs artifacts artifacts/latest.json

            - name: Authenticate to Google Cloud
              uses: google-github-actions/auth@v2
              with:
                  credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
                  project_id: wmb-table
                  create_credentials_file: true
                  export_environment_variables: true

            - name: Set up Google Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Upload release files to Firebase Storage
              env:
                  FIREBASE_STORAGE_BUCKET: wmb-table.appspot.com
              run: |
                  gcloud storage cp artifacts/* "gs://${FIREBASE_STORAGE_BUCKET}/releases/"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest.json" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest.yml" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest-linux.yml" --cache-control="no-store, max-age=0"
                  gcloud storage objects update "gs://${FIREBASE_STORAGE_BUCKET}/releases/latest-mac.yml" --cache-control="no-store, max-age=0"

    cleanup:
        needs: [build, publish]
        if: always()
        runs-on: ubuntu-latest
        steps:
            - name: Delete build artifacts
              uses: geekyeggo/delete-artifact@v5
              with:
                  name: release-*
